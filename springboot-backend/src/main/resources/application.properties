server.port=8080
spring.application.name=AI_Assistant

# =============================================
# HTTPS配置 - [已修复 - 问题94] 添加SSL安全配置
# =============================================
# 注意：生产环境需要配置SSL证书
server.ssl.enabled=false
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-password=${SSL_KEY_PASSWORD:}
server.ssl.key-store-type=PKCS12

# 数据库配置 - 敏感信息从环境变量获取
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/AI_Patent_Assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=none
mybatis-plus.global-config.db-config.table-underline=true

# Redis配置 - 敏感信息从环境变量获取
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}

# 微信小程序配置 - 敏感信息从环境变量获取
wechat.miniapp.app-id=${WECHAT_APP_ID:}
wechat.miniapp.app-secret=${WECHAT_APP_SECRET}
# 如果IDE提示'wechat.miniapp.secret'是未知属性，这是正常的，因为该属性来自第三方微信SDK
# 可以通过在IDE中添加配置元数据或忽略此警告来解决

# =============================================
# RabbitMQ配置
# =============================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:patent}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/
# 连接超时时间
spring.rabbitmq.connection-timeout=10000
# 消息确认配置
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# 消费者配置 - 使用手动确认模式确保消息可靠性
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10
